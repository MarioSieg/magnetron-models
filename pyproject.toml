[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetron-models"
version = "0.1.0"
description = "Training and Inference (Qwen3 LLMs, Qwen-Image 2.1 text-to-image, more to come) using the Magnetron ML framework."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=1.20.1",
    "magnetron>=0.2.1",
    "rich>=15.0.0",
    "tokenizers>=0.23.1",
]

[project.optional-dependencies]
conversion = [
    "safetensors",
    "torch",
    "ruff",
]

[project.scripts]
generate-image = "magnetron_models.generate_image:main"
convert-qwen3 = "dataset_conversion_pipelines.convert_qwen3:main"
convert-qwen3-5 = "dataset_conversion_pipelines.convert_qwen3_5:main"
convert-qwen3-5-moe = "dataset_conversion_pipelines.convert_qwen3_5_moe:main"
convert-qwen-image-2-1 = "dataset_conversion_pipelines.convert_qwen_image_2_1:main"

[tool.setuptools]
packages = { find = { include = ["magnetron_models*", "dataset_conversion_pipelines*"] } }

[tool.ruff]
line-length = 150
indent-width = 4
exclude = [
    ".venv",
    "build",
    "docs",
    "extern",
    "test",
    "tools",
    "fuzzer",
    "cmake",
    "bin",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "PERF",
    "RUF",
    "ANN",
]

ignore = [
    "E501",
    "E701",
    "E702",
    "ANN401",
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"setup.py" = ["ANN"]
"test/**/*.py" = ["ANN"]
"tests/**/*.py" = ["ANN"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = true
